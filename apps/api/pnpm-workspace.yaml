# Configurazione pnpm generata durante l'installazione e annotata da noi.
# Decide se eseguire script di build forniti da dipendenze esterne.
# Non definisce i moduli di NutriTrack e non configura i test.
allowBuilds:
  # false impedisce gli script di questi pacchetti, non il loro download.
  # Il test della fase 0 funziona senza questi build opzionali.
  '@nestjs/core': false
  '@parcel/watcher': false
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  prisma: true
  unrs-resolver: false
# Gli script usano le dipendenze già installate: install:all è un passo separato.
verifyDepsBeforeRun: false
